<!DOCTYPE html>
<html>
<head>
  <title>Palette Comparison</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      padding: 20px;
    }
    .comparison {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .image-box {
      flex: 1;
      min-width: 300px;
    }
    img {
      width: 100%;
      image-rendering: pixelated;
      border: 2px solid #666;
    }
    h2 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <h1>Palette Comparison - 3D Prototype</h1>
  
  <div class="comparison">
    <div class="image-box">
      <h2>Without Palette (Raw sRGB)</h2>
      <img src="../screenshots/proto-no-palette.png" alt="No palette">
      <p>Linear → sRGB conversion only, no quantization</p>
    </div>
    <div class="image-box">
      <h2>With Palette (50 colors)</h2>
      <img src="../screenshots/proto-start.png" alt="With palette">
      <p>Perceptual distance snapping to 50-color palette</p>
    </div>
  </div>
  
  <h2>Other Captures</h2>
  <div class="comparison">
    <div class="image-box">
      <h3>One Step Forward</h3>
      <img src="../screenshots/proto-forward.png" alt="Forward">
    </div>
    <div class="image-box">
      <h3>Water Hall</h3>
      <img src="../screenshots/proto-water.png" alt="Water hall">
    </div>
  </div>
  
  <div class="comparison">
    <div class="image-box">
      <h3>Door (2 squares away)</h3>
      <img src="../screenshots/proto-door.png" alt="Door">
    </div>
    <div class="image-box">
      <h3>Slime (1 square away)</h3>
      <img src="../screenshots/proto-slime.png" alt="Slime">
    </div>
  </div>
</body>
</html>
