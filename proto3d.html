<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="%BASE_URL%proto3d/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icon_drowning_180.png" />
  <link rel="icon" href="%BASE_URL%icon_drowning_192.png" />
  <title>Sunken Keep 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      touch-action: none;
      position: fixed;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding-top: env(safe-area-inset-top, 0);
      padding-left: 0;
      padding-right: 0;
      padding-bottom: 0;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      line-height: 0;
      background: #000;
    }
    #party-hud {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      line-height: 0;
      background: #000;
    }
    #party-canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    .hand-btn {
      position: absolute;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 20;
    }
    .hand-btn.swap-armed {
      outline: 2px solid #f0d060;
      outline-offset: 1px;
      background: rgba(240, 208, 96, 0.42);
      box-shadow: 0 0 0 1px #3a2a10, 0 0 8px 2px rgba(240, 208, 96, 0.65);
    }
    #torch-choice {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      z-index: 80;
      pointer-events: auto;
    }
    #torch-choice.show { display: flex; }
    .hud-choice-btn {
      min-width: 44px;
      min-height: 44px;
      width: max(44px, calc(52 * (100vw / 270)));
      max-width: calc(56 * (100vw / 270));
      height: max(44px, calc(31 * (100vw / 270)));
      padding: 0 6px;
      border: 0;
      background: #2a2420 url('%BASE_URL%art/ui/panel/btn_choice.png') center / 100% 100% no-repeat;
      color: #d8ccb0;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      image-rendering: pixelated;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hud-choice-btn:active {
      background-image: url('%BASE_URL%art/ui/panel/btn_choice_pressed.png');
    }
    #render-canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    #controls {
      position: relative;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 4px;
      justify-content: center;
      margin-top: 4px;
      padding: 0 8px 4px;
      padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }
    .control-btn {
      min-width: 44px;
      min-height: 44px;
      width: 44px;
      height: 44px;
      background: rgba(40, 40, 40, 0.7);
      border: 2px solid #666;
      border-radius: 8px;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      touch-action: none;
    }
    .control-btn:active {
      background: rgba(60, 60, 60, 0.9);
      border-color: #888;
    }
    #btn-forward { grid-column: 2; grid-row: 1; }
    #btn-door {
      grid-column: 3;
      grid-row: 1;
      display: none;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    #btn-door.visible { display: flex; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-back { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #message-toast {
      position: fixed;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #e8e0d0;
      font-family: monospace;
      font-size: 18px;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 300;
    }
    #message-toast.show { opacity: 1; }
    #tap-to-start {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-family: monospace;
      color: #fff;
    }
    #tap-to-start.hidden {
      display: none;
    }
    #tap-to-start-text {
      font-size: 24px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #gameover {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: flex-start;
      justify-content: center;
      background: #0a1210;
      image-rendering: pixelated;
    }
    #gameover.show { display: flex; }
    #gameover-stage {
      position: relative;
      width: min(100vw, calc(100vh * 270 / 585));
      aspect-ratio: 270 / 585;
      background: url('%BASE_URL%art/ui/gameover/gameover_bg.png') center / 100% 100% no-repeat;
      image-rendering: pixelated;
    }
    #gameover-title,
    #gameover-body {
      position: absolute;
      left: calc(10 / 270 * 100%);
      width: calc(250 / 270 * 100%);
      color: #d8ccb0;
      font-family: monospace;
      text-align: center;
      text-shadow: 1px 1px 0 #1a1210;
      pointer-events: none;
    }
    #gameover-title {
      top: calc(232 / 585 * 100%);
      height: calc(24 / 585 * 100%);
      font-size: clamp(11px, 4.2vw, 16px);
    }
    #gameover-body {
      top: calc(256 / 585 * 100%);
      height: calc(20 / 585 * 100%);
      font-size: clamp(10px, 3.6vw, 13px);
    }
    .gameover-btn {
      position: absolute;
      left: calc(85 / 270 * 100%);
      width: calc(100 / 270 * 100%);
      height: calc(31 / 585 * 100%);
      padding: 0;
      border: 4px solid transparent;
      border-image: url('%BASE_URL%art/ui/panel/button_9slice.png') 4 fill;
      background: transparent;
      color: #d8ccb0;
      font-family: monospace;
      font-size: clamp(10px, 3.4vw, 13px);
      text-shadow: 1px 1px 0 #1a1210;
      image-rendering: pixelated;
      cursor: pointer;
    }
    #btn-go-autosave { top: calc(410 / 585 * 100%); }
    #btn-go-floor { top: calc(449 / 585 * 100%); }
    .gameover-btn:active {
      border-image-source: url('%BASE_URL%art/ui/panel/button_pressed_9slice.png');
      transform: translate(1px, 1px);
    }
    .gameover-btn[hidden] { display: none; }
    #fps-counter {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      padding: 5px 10px;
      font-family: monospace;
      font-size: 12px;
      z-index: 200;
      display: none; /* Hidden by default, shown with ?debug=1 */
    }
    #oil-readout {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #e8c98a;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      z-index: 200;
      pointer-events: none;
    }
    #note-overlay {
      position: fixed;
      left: 50%;
      top: 18%;
      transform: translate(-50%, 0);
      width: min(88vw, 360px);
      background: rgba(18, 14, 10, 0.92);
      border: 1px solid #8a7348;
      color: #e8e0d0;
      font-family: monospace;
      padding: 12px 14px 14px;
      z-index: 280;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    #note-overlay.show { opacity: 1; }
    #note-title {
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #d4b56a;
      margin-bottom: 12px;
    }
    #note-text {
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      word-spacing: 0.2em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="tap-to-start">
    <div id="tap-to-start-text"></div>
    <div style="font-size: 12px; color: #888;">3D Prototype</div>
  </div>
  <div id="canvas-container">
    <canvas id="render-canvas"></canvas>
    <div id="torch-choice">
      <button id="btn-torch-take" class="hud-choice-btn" type="button"></button>
      <button id="btn-torch-snuff" class="hud-choice-btn" type="button"></button>
    </div>
  </div>
  <div id="party-hud">
    <canvas id="party-canvas"></canvas>
  </div>
  <div id="controls">
    <button id="btn-forward" class="control-btn">↑</button>
    <button id="btn-door" class="control-btn" type="button"></button>
    <button id="btn-left" class="control-btn">←</button>
    <button id="btn-back" class="control-btn">↓</button>
    <button id="btn-right" class="control-btn">→</button>
  </div>
  <div id="message-toast"></div>
  <div id="note-overlay">
    <div id="note-title"></div>
    <div id="note-text"></div>
  </div>
  <div id="oil-readout"></div>
  <div id="gameover">
    <div id="gameover-stage">
      <div id="gameover-title"></div>
      <div id="gameover-body"></div>
      <button id="btn-go-autosave" class="gameover-btn" type="button" hidden></button>
      <button id="btn-go-floor" class="gameover-btn" type="button"></button>
    </div>
  </div>
  <script type="module" src="/src/proto3d/main.ts"></script>
</body>
</html>
