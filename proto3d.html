<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="%BASE_URL%proto3d/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icon_drowning_180.png" />
  <link rel="icon" href="%BASE_URL%icon_drowning_192.png" />
  <title>Sunken Keep 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      touch-action: none;
      position: fixed;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding-top: env(safe-area-inset-top, 0);
      padding-left: 0;
      padding-right: 0;
      padding-bottom: 0;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      line-height: 0;
      background: #000;
    }
    #render-canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    #controls {
      position: relative;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 4px;
      justify-content: center;
      margin-top: 4px;
      padding: 0 8px 4px;
      padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }
    .control-btn {
      min-width: 44px;
      min-height: 44px;
      width: 44px;
      height: 44px;
      background: rgba(40, 40, 40, 0.7);
      border: 2px solid #666;
      border-radius: 8px;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      touch-action: none;
    }
    .control-btn:active {
      background: rgba(60, 60, 60, 0.9);
      border-color: #888;
    }
    #btn-forward { grid-column: 2; grid-row: 1; }
    #btn-door {
      grid-column: 3;
      grid-row: 1;
      display: none;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    #btn-door.visible { display: flex; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-back { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #message-toast {
      position: fixed;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #e8e0d0;
      font-family: monospace;
      font-size: 18px;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 300;
    }
    #message-toast.show { opacity: 1; }
    #tap-to-start {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-family: monospace;
      color: #fff;
    }
    #tap-to-start.hidden {
      display: none;
    }
    #tap-to-start-text {
      font-size: 24px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #fps-counter {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      padding: 5px 10px;
      font-family: monospace;
      font-size: 12px;
      z-index: 200;
      display: none; /* Hidden by default, shown with ?debug=1 */
    }
    #oil-readout {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #e8c98a;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      z-index: 200;
      pointer-events: none;
    }
    #note-overlay {
      position: fixed;
      left: 50%;
      top: 18%;
      transform: translate(-50%, 0);
      width: min(88vw, 360px);
      background: rgba(18, 14, 10, 0.92);
      border: 1px solid #8a7348;
      color: #e8e0d0;
      font-family: monospace;
      padding: 12px 14px 14px;
      z-index: 280;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    #note-overlay.show { opacity: 1; }
    #note-title {
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #d4b56a;
      margin-bottom: 12px;
    }
    #note-text {
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      word-spacing: 0.2em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="tap-to-start">
    <div id="tap-to-start-text">TAP TO START</div>
    <div style="font-size: 12px; color: #888;">3D Prototype</div>
  </div>
  <div id="canvas-container">
    <canvas id="render-canvas"></canvas>
  </div>
  <div id="controls">
    <button id="btn-forward" class="control-btn">↑</button>
    <button id="btn-door" class="control-btn" type="button">DOOR</button>
    <button id="btn-left" class="control-btn">←</button>
    <button id="btn-back" class="control-btn">↓</button>
    <button id="btn-right" class="control-btn">→</button>
  </div>
  <div id="message-toast"></div>
  <div id="note-overlay">
    <div id="note-title"></div>
    <div id="note-text"></div>
  </div>
  <div id="oil-readout">Oil 2/4</div>
  <div id="fps-counter">FPS: --</div>
  <script type="module" src="/src/proto3d/main.ts"></script>
</body>
</html>
