<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sunken Keep 3D Prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      touch-action: none;
      position: fixed;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding-top: env(safe-area-inset-top, 0);
      padding-left: 0;
      padding-right: 0;
      padding-bottom: 0;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      line-height: 0;
      background: #000;
    }
    #render-canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    #controls {
      position: relative;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 4px;
      justify-content: center;
      margin-top: 4px;
      padding: 0 8px 4px;
      padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }
    .control-btn {
      min-width: 44px;
      min-height: 44px;
      width: 44px;
      height: 44px;
      background: rgba(40, 40, 40, 0.7);
      border: 2px solid #666;
      border-radius: 8px;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      touch-action: none;
    }
    .control-btn:active {
      background: rgba(60, 60, 60, 0.9);
      border-color: #888;
    }
    #btn-forward { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-back { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #tap-to-start {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-family: monospace;
      color: #fff;
    }
    #tap-to-start.hidden {
      display: none;
    }
    #tap-to-start-text {
      font-size: 24px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #fps-counter {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      padding: 5px 10px;
      font-family: monospace;
      font-size: 12px;
      z-index: 200;
      display: none; /* Hidden by default, shown with ?debug=1 */
    }
  </style>
</head>
<body>
  <div id="tap-to-start">
    <div id="tap-to-start-text">TAP TO START</div>
    <div style="font-size: 12px; color: #888;">3D Prototype</div>
  </div>
  <div id="canvas-container">
    <canvas id="render-canvas"></canvas>
  </div>
  <div id="controls">
    <button id="btn-forward" class="control-btn">↑</button>
    <button id="btn-left" class="control-btn">←</button>
    <button id="btn-back" class="control-btn">↓</button>
    <button id="btn-right" class="control-btn">→</button>
  </div>
  <div id="fps-counter">FPS: --</div>
  <script type="module" src="/src/proto3d/main.ts"></script>
</body>
</html>
