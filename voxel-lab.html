<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050403" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Voxel Lab — Sunken Keep</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #050403;
      touch-action: none;
      position: fixed;
      overscroll-behavior: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #d8ccb0;
    }
    #lab-canvas {
      display: block;
      width: 100%;
      height: 100dvh;
      touch-action: none;
    }
    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
      pointer-events: none;
    }
    #stats {
      pointer-events: auto;
      user-select: text;
      -webkit-user-select: text;
      flex: 0 0 auto;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.82);
      color: #c8ff9a;
      padding: 10px 12px;
      font-size: 16px;
      letter-spacing: 0.02em;
      line-height: 1.45;
      border-radius: 6px;
      text-shadow: 0 1px 0 #000;
    }
    #stats b { color: #e7ffc4; font-weight: 700; }
    #toggles {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      pointer-events: auto;
    }
    #ooze-ui {
      display: contents;
    }
    #look {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: rgba(0, 0, 0, 0.82);
      padding: 8px 10px;
      border-radius: 8px;
    }
    #look label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: #e8d8a0;
    }
    #slider-warmth {
      width: 150px;
      height: 44px;
      accent-color: #e8d8a0;
      cursor: pointer;
    }
    #move {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      z-index: 5;
      width: max-content;
      max-width: calc(100% - 16px);
    }
    #hint {
      position: fixed;
      bottom: max(88px, calc(env(safe-area-inset-bottom) + 76px));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: #c4b89a;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      z-index: 4;
    }
    button.lab {
      min-width: 48px;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid #6a5a40;
      background: rgba(18, 14, 10, 0.82);
      color: #e8d8a0;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.04em;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button.lab:active { background: rgba(40, 32, 20, 0.95); }
    button.lab[aria-pressed="false"] { color: #8a8070; }
    button.lab.turn {
      min-width: 88px;
      min-height: 48px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.2;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050403;
      z-index: 20;
      font-size: 16px;
      color: #e8d8a0;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="lab-canvas"></canvas>
  <div id="loading">Loading textures…</div>
  <div id="hud">
    <div id="stats">—</div>
    <div id="toggles">
      <button id="btn-shadows" class="lab" type="button" aria-pressed="true">Shadows on</button>
      <button id="btn-lantern" class="lab" type="button" aria-pressed="true">Lantern on</button>
      <button id="btn-mode" class="lab" type="button" aria-pressed="true">Voxels</button>
      <button id="btn-match" class="lab" type="button" aria-pressed="false">Match game</button>
      <button id="btn-see-through" class="lab" type="button" aria-pressed="false">See-through slime</button>
      <div id="look">
        <label for="slider-warmth">Light warmth
          <input id="slider-warmth" type="range" min="0" max="100" value="100" step="1" />
        </label>
      </div>
      <span id="ooze-ui">
        <button id="btn-ooze-res" class="lab" type="button" aria-pressed="true">Res 32</button>
        <button id="btn-ooze-mat" class="lab" type="button" aria-pressed="true">Wet stone</button>
        <button id="btn-ooze-anim" class="lab" type="button">Anim idle</button>
        <button id="btn-ooze-dist" class="lab" type="button" aria-pressed="true">1 square</button>
        <button id="btn-ooze-view" class="lab" type="button" aria-pressed="true">Game cam</button>
        <button id="btn-ooze-compare" class="lab" type="button" aria-pressed="false">Compare sprite</button>
        <button id="btn-ooze-reset" class="lab" type="button">Reset ooze</button>
      </span>
    </div>
  </div>
  <div id="hint">Gray Ooze lab (not in the game) · drag to look · step / turn with the arrows · tap Pell’s lamp</div>
  <div id="move">
    <button id="btn-left" class="lab turn" type="button" aria-label="Turn left">Turn Left</button>
    <button id="btn-back" class="lab" type="button" aria-label="Step back">▼</button>
    <button id="btn-fwd" class="lab" type="button" aria-label="Step forward">▲</button>
    <button id="btn-right" class="lab turn" type="button" aria-label="Turn right">Turn Right</button>
  </div>
  <script type="module" src="/src/voxel-lab/main.ts"></script>
</body>
</html>
