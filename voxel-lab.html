<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050403" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Voxel Lab — Sunken Keep</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #050403;
      touch-action: none;
      position: fixed;
      overscroll-behavior: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #d8ccb0;
    }
    #lab-canvas {
      display: block;
      width: 100%;
      height: 100dvh;
      touch-action: none;
    }
    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
      pointer-events: none;
    }
    #stats {
      pointer-events: none;
      background: rgba(0, 0, 0, 0.62);
      color: #9fef9f;
      padding: 6px 10px;
      font-size: 12px;
      letter-spacing: 0.03em;
      line-height: 1.35;
      border-radius: 4px;
    }
    #toggles {
      margin-left: auto;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    #move {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 5;
    }
    #hint {
      position: fixed;
      bottom: max(76px, calc(env(safe-area-inset-bottom) + 64px));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: #c4b89a;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      z-index: 4;
    }
    button.lab {
      min-width: 48px;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid #6a5a40;
      background: rgba(18, 14, 10, 0.82);
      color: #e8d8a0;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.04em;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button.lab:active { background: rgba(40, 32, 20, 0.95); }
    button.lab[aria-pressed="false"] { color: #8a8070; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050403;
      z-index: 20;
      font-size: 16px;
      color: #e8d8a0;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="lab-canvas"></canvas>
  <div id="loading">Loading textures…</div>
  <div id="hud">
    <div id="stats">—</div>
    <div id="toggles">
      <button id="btn-shadows" class="lab" type="button" aria-pressed="true">Shadows on</button>
      <button id="btn-mode" class="lab" type="button" aria-pressed="true">Voxels</button>
    </div>
  </div>
  <div id="hint">Drag to look · step with the arrows · tap Pell’s lamp</div>
  <div id="move">
    <button id="btn-back" class="lab" type="button" aria-label="Step back">▼</button>
    <button id="btn-fwd" class="lab" type="button" aria-label="Step forward">▲</button>
  </div>
  <script type="module" src="/src/voxel-lab/main.ts"></script>
</body>
</html>
