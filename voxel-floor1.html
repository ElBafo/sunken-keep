<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050403" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Voxel Floor 1 — Sunken Keep</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #050403;
      touch-action: none;
      position: fixed;
      overscroll-behavior: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #d8ccb0;
    }
    #floor1-canvas {
      display: block;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: auto;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }
    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
      pointer-events: none;
    }
    #hud[hidden] { display: none; }
    #gfx {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      z-index: 5;
    }
    #gfx .lab {
      min-width: 88px;
      font-size: 12px;
    }
    #stats {
      pointer-events: auto;
      user-select: text;
      -webkit-user-select: text;
      flex: 0 0 auto;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.82);
      color: #c8ff9a;
      padding: 10px 12px;
      font-size: 16px;
      letter-spacing: 0.02em;
      line-height: 1.45;
      border-radius: 6px;
      text-shadow: 0 1px 0 #000;
    }
    #stats b { color: #e7ffc4; font-weight: 700; }
    #move {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      z-index: 5;
      width: max-content;
      max-width: calc(100% - 16px);
    }
    button.lab {
      min-width: 48px;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid #6a5a40;
      background: rgba(18, 14, 10, 0.82);
      color: #e8d8a0;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.04em;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button.lab:active { background: rgba(40, 32, 20, 0.95); }
    button.lab.turn {
      min-width: 88px;
      min-height: 48px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.2;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050403;
      z-index: 20;
      font-size: 16px;
      color: #e8d8a0;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="floor1-canvas"></canvas>
  <div id="loading">Loading textures…</div>
  <div id="hud" hidden>
    <div id="stats">—</div>
  </div>
  <div id="gfx">
    <button id="btn-quality" class="lab" type="button" aria-label="Graphics quality">Gfx Max</button>
  </div>
  <div id="move">
    <button id="btn-left" class="lab turn" type="button" aria-label="Turn left">Turn Left</button>
    <button id="btn-back" class="lab" type="button" aria-label="Step back">▼</button>
    <button id="btn-fwd" class="lab" type="button" aria-label="Step forward">▲</button>
    <button id="btn-right" class="lab turn" type="button" aria-label="Turn right">Turn Right</button>
  </div>
  <script type="module" src="/src/voxel-floor1/main.ts"></script>
</body>
</html>
